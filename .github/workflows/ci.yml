name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build

  ci:
    name: ci
    if: always()
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check job results
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "A required job did not succeed."
            exit 1
          fi
